<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F4EA"/>
      <stop offset="1" stop-color="#ECE6D4"/>
    </linearGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0.1 0"/></filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#paper)"/>
  <!-- newspaper columns -->
  <g fill="#292D29" fill-opacity="0.08">
    <rect x="90" y="120" width="300" height="8"/><rect x="90" y="140" width="270" height="8"/><rect x="90" y="160" width="290" height="8"/><rect x="90" y="180" width="240" height="8"/>
    <rect x="1230" y="760" width="280" height="8"/><rect x="1230" y="780" width="250" height="8"/><rect x="1230" y="800" width="270" height="8"/><rect x="1230" y="820" width="200" height="8"/>
  </g>
  <line x1="90" y1="96" x2="1510" y2="96" stroke="#183D32" stroke-width="4"/>
  <line x1="90" y1="106" x2="1510" y2="106" stroke="#183D32" stroke-width="1.5"/>

  <!-- chart frame -->
  <g stroke="#183D32" stroke-opacity="0.15" stroke-width="2">
    <line x1="480" y1="260" x2="1460" y2="260"/><line x1="480" y1="380" x2="1460" y2="380"/>
    <line x1="480" y1="500" x2="1460" y2="500"/><line x1="480" y1="620" x2="1460" y2="620"/>
  </g>
  <!-- candlesticks -->
  <g stroke-width="4">
    <g stroke="#183D32" fill="#183D32"><line x1="540" y1="520" x2="540" y2="660"/><rect x="522" y="560" width="36" height="70"/></g>
    <g stroke="#C8795B" fill="#C8795B"><line x1="620" y1="500" x2="620" y2="640"/><rect x="602" y="530" width="36" height="80"/></g>
    <g stroke="#183D32" fill="#183D32"><line x1="700" y1="440" x2="700" y2="600"/><rect x="682" y="470" width="36" height="100"/></g>
    <g stroke="#183D32" fill="#183D32"><line x1="780" y1="400" x2="780" y2="540"/><rect x="762" y="420" width="36" height="90"/></g>
    <g stroke="#C8795B" fill="#C8795B"><line x1="860" y1="410" x2="860" y2="560"/><rect x="842" y="440" width="36" height="80"/></g>
    <g stroke="#183D32" fill="#183D32"><line x1="940" y1="330" x2="940" y2="500"/><rect x="922" y="360" width="36" height="110"/></g>
    <g stroke="#183D32" fill="#183D32"><line x1="1020" y1="290" x2="1020" y2="430"/><rect x="1002" y="310" width="36" height="90"/></g>
    <g stroke="#C8795B" fill="#C8795B"><line x1="1100" y1="300" x2="1100" y2="450"/><rect x="1082" y="330" width="36" height="80"/></g>
    <g stroke="#183D32" fill="#183D32"><line x1="1180" y1="220" x2="1180" y2="380"/><rect x="1162" y="250" width="36" height="100"/></g>
    <g stroke="#183D32" fill="#183D32"><line x1="1260" y1="180" x2="1260" y2="320"/><rect x="1242" y="200" width="36" height="90"/></g>
  </g>
  <path d="M520 640 C640 600 700 520 800 470 S960 420 1040 360 S1200 250 1300 190 L1400 150" fill="none" stroke="#D7B45A" stroke-width="9" stroke-linecap="round"/>
  <circle cx="1400" cy="150" r="14" fill="#D7B45A"/>

  <!-- open book -->
  <g transform="translate(330 790)">
    <path d="M-250 -10 C-160 -60 -60 -50 0 -10 L0 120 C-60 80 -160 70 -250 120Z" fill="#FFFFFF" stroke="#183D32" stroke-width="5"/>
    <path d="M250 -10 C160 -60 60 -50 0 -10 L0 120 C60 80 160 70 250 120Z" fill="#FFFFFF" stroke="#183D32" stroke-width="5"/>
    <g fill="none" stroke="#183D32" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round">
      <path d="M-210 20 C-150 0 -90 0 -40 20"/><path d="M-210 50 C-150 30 -90 30 -40 50"/><path d="M-210 80 C-150 60 -90 60 -40 80"/>
      <path d="M40 20 C90 0 150 0 210 20"/><path d="M40 50 C90 30 150 30 210 50"/><path d="M40 80 C90 60 150 60 210 80"/>
    </g>
  </g>

  <!-- quiz mark + symbols -->
  <text x="300" y="560" text-anchor="middle" font-family="Georgia, serif" font-size="420" font-style="italic" fill="#C8795B">?</text>
  <g font-family="Georgia, serif" font-size="64" fill="#183D32" fill-opacity="0.75">
    <text x="1380" y="560">₹</text><text x="1440" y="470" fill="#D7B45A">%</text><text x="1300" y="640" fill-opacity="0.5">$</text>
  </g>
  <text x="90" y="80" font-family="'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="10" fill="#183D32">MARKETS · FINANCE · CURRENT AFFAIRS</text>
  <rect width="1600" height="1000" filter="url(#grain)"/>
</svg>
