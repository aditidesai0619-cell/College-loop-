<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4E1D9"/>
      <stop offset="1" stop-color="#E8C9BE"/>
    </linearGradient>
    <linearGradient id="mic" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F6252"/>
      <stop offset="0.5" stop-color="#4E8270"/>
      <stop offset="1" stop-color="#183D32"/>
    </linearGradient>
    <pattern id="mesh" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="3" fill="#0E271F" fill-opacity="0.45"/>
    </pattern>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.4  0 0 0 0 0.2  0 0 0 0 0.15  0 0 0 0.07 0"/></filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- big flower motif -->
  <g transform="translate(1250 480) scale(0.85)">
    <g fill="#C8795B">
      <ellipse cx="0" cy="-170" rx="70" ry="150"/>
      <ellipse cx="0" cy="-170" rx="70" ry="150" transform="rotate(60)"/>
      <ellipse cx="0" cy="-170" rx="70" ry="150" transform="rotate(120)"/>
      <ellipse cx="0" cy="-170" rx="70" ry="150" transform="rotate(180)"/>
      <ellipse cx="0" cy="-170" rx="70" ry="150" transform="rotate(240)"/>
      <ellipse cx="0" cy="-170" rx="70" ry="150" transform="rotate(300)"/>
    </g>
    <g fill="#E39C80">
      <ellipse cx="0" cy="-110" rx="44" ry="96" transform="rotate(30)"/>
      <ellipse cx="0" cy="-110" rx="44" ry="96" transform="rotate(90)"/>
      <ellipse cx="0" cy="-110" rx="44" ry="96" transform="rotate(150)"/>
      <ellipse cx="0" cy="-110" rx="44" ry="96" transform="rotate(210)"/>
      <ellipse cx="0" cy="-110" rx="44" ry="96" transform="rotate(270)"/>
      <ellipse cx="0" cy="-110" rx="44" ry="96" transform="rotate(330)"/>
    </g>
    <circle r="78" fill="#D7B45A"/>
    <circle r="78" fill="none" stroke="#183D32" stroke-width="4" stroke-dasharray="3 12"/>
  </g>

  <!-- leaves -->
  <g fill="#183D32">
    <path d="M1400 860 C1380 760 1450 690 1540 680 C1540 780 1480 850 1400 860Z"/>
    <path d="M980 880 C960 790 1000 720 1090 700 C1100 790 1050 860 980 880Z" fill="#A8B9A0"/>
  </g>

  <!-- microphone on stand (object only) -->
  <g transform="translate(800 260)">
    <rect x="-55" y="0" width="110" height="170" rx="55" fill="url(#mic)"/>
    <rect x="-55" y="0" width="110" height="170" rx="55" fill="url(#mesh)"/>
    <rect x="-62" y="120" width="124" height="18" rx="9" fill="#D7B45A"/>
    <path d="M-90 110 C-90 210 90 210 90 110" fill="none" stroke="#183D32" stroke-width="12" stroke-linecap="round"/>
    <rect x="-8" y="200" width="16" height="360" fill="#183D32"/>
    <ellipse cx="0" cy="570" rx="110" ry="22" fill="#183D32"/>
  </g>
  <!-- sound arcs -->
  <g fill="none" stroke="#C8795B" stroke-width="7" stroke-linecap="round">
    <path d="M920 270 a90 90 0 0 1 0 120"/>
    <path d="M960 230 a140 140 0 0 1 0 200" stroke-opacity="0.6"/>
    <path d="M680 270 a90 90 0 0 0 0 120"/>
    <path d="M640 230 a140 140 0 0 0 0 200" stroke-opacity="0.6"/>
  </g>

  <!-- typography -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#183D32">
    <text x="110" y="300" font-size="132" font-weight="700">LEAD.</text>
    <text x="110" y="440" font-size="132" font-style="italic" fill="#C8795B">Speak.</text>
    <text x="110" y="580" font-size="132" font-weight="700">RISE.</text>
  </g>
  <rect x="114" y="630" width="160" height="10" rx="5" fill="#D7B45A"/>
  <text x="114" y="700" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="6" fill="#183D32" fill-opacity="0.8">LEADERSHIP · PUBLIC SPEAKING</text>
  <rect width="1600" height="1000" filter="url(#grain)"/>
</svg>
