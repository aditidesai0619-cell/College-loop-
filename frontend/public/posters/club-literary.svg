<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEF2EA"/>
      <stop offset="1" stop-color="#DCE5D6"/>
    </linearGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.2  0 0 0 0 0.25  0 0 0 0 0.2  0 0 0 0.08 0"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <!-- giant typographic letters -->
  <g font-family="Georgia, serif" font-weight="700">
    <text x="60" y="760" font-size="700" fill="#A8B9A0" fill-opacity="0.45">A</text>
    <text x="1060" y="620" font-size="520" font-style="italic" fill="#E8C9BE">z</text>
  </g>
  <!-- stacked books -->
  <g transform="translate(800 800)">
    <rect x="-260" y="-70" width="520" height="70" rx="6" fill="#183D32"/>
    <rect x="-240" y="-62" width="12" height="54" fill="#D7B45A"/>
    <rect x="-220" y="-140" width="470" height="70" rx="6" fill="#C8795B"/>
    <rect x="-200" y="-132" width="300" height="10" fill="#F4DDD3"/>
    <rect x="-280" y="-210" width="430" height="70" rx="6" fill="#D7B45A"/>
    <rect x="100" y="-202" width="12" height="54" fill="#183D32"/>
    <rect x="-200" y="-280" width="400" height="70" rx="6" fill="#292D29"/>
    <rect x="-180" y="-256" width="200" height="10" fill="#A8B9A0"/>
    <!-- open book on top -->
    <path d="M-180 -300 C-110 -350 -30 -340 0 -300 C30 -340 110 -350 180 -300 L180 -290 L-180 -290Z" fill="#FFFFFF" stroke="#183D32" stroke-width="5"/>
  </g>
  <!-- coin -->
  <circle cx="1300" cy="780" r="70" fill="#D7B45A"/>
  <circle cx="1300" cy="780" r="52" fill="none" stroke="#AF8C35" stroke-width="6"/>
  <text x="1300" y="805" text-anchor="middle" font-family="Georgia, serif" font-size="70" fill="#AF8C35">₹</text>
  <text x="120" y="140" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="12" fill="#183D32">FINANCIAL &amp; LITERARY CLUB</text>
  <rect width="1600" height="1000" filter="url(#grain)"/>
</svg>
